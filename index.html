<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Solar Clock</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solar Clock">
<meta name="theme-color" content="#0a0c1a">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
  :root{
    --sky-top:#0a0c1a; --sky-mid:#10143a; --sky-bot:#0a0c1a;
    --ink:#f3ead8; --dim:#b9b3a6; --faint:#6f6a60;
    --serif:"Hoefler Text","Iowan Old Style",Charter,Georgia,serif;
    --mono:"Menlo","SF Mono",ui-monospace,Monaco,"Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{
    height:100%;
    /* fill behind the status bar and home-indicator safe areas so no
       default-white shows through in standalone (Add to Home Screen) mode */
    background:var(--sky-bot);
    transition:background 1.6s linear;
  }
  body{
    font-family:var(--mono); color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 58%,var(--sky-bot) 100%);
    background-attachment:fixed;
    transition:background 1.6s linear;
    min-height:100vh; min-height:100dvh; overflow:hidden; position:relative;
    -webkit-user-select:none; user-select:none;
  }
  /* star field — only visible against dark sky */
  #stars{position:fixed;inset:0;pointer-events:none;opacity:var(--star,0);transition:opacity 2s linear}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
        box-shadow:0 0 3px #fff;animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
  /* sun / horizon */
  #horizon{position:fixed;left:0;right:0;top:72%;height:1px;
           background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);pointer-events:none}
  #sun{position:fixed;left:50%;top:72%;width:34vmin;height:34vmin;margin:-17vmin 0 0 -17vmin;
       border-radius:50%;pointer-events:none;
       background:radial-gradient(circle,rgba(255,228,170,.95) 0%,rgba(255,201,120,.55) 38%,rgba(255,180,110,0) 70%);
       transition:transform 1.6s linear,opacity 1.6s linear;will-change:transform}
  /* layout */
  .wrap{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;
        justify-content:space-between;
        padding:calc(env(safe-area-inset-top) + 22px) 24px calc(env(safe-area-inset-bottom) + 26px);}
  .phase{font-family:var(--serif);font-size:19px;letter-spacing:.04em;font-style:italic;
         color:var(--ink);opacity:.92;text-shadow:0 1px 12px rgba(0,0,0,.4)}
  .real{font-size:12.5px;color:var(--dim);margin-top:5px;letter-spacing:.02em}
  .real.there{margin-top:2px;color:#e7b87a}
  .centre{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .clock{font-size:clamp(44px,15vw,86px);font-weight:300;letter-spacing:.01em;
         font-variant-numeric:tabular-nums;text-shadow:0 2px 30px rgba(0,0,0,.45);line-height:1}
  .clk-label{font-family:var(--serif);font-size:13px;letter-spacing:.34em;text-transform:uppercase;
             color:var(--dim);margin-top:18px}
  .foot{display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:var(--faint);letter-spacing:.02em}
  .row{display:flex;justify-content:space-between;gap:14px}
  .row b{color:var(--dim);font-weight:400}
  .tap{color:var(--dim);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  /* manual location sheet — opaque base tied to the live sky colour so the whole
     screen (incl. the home-indicator safe area) dims uniformly with no band */
  #sheet{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
         background:var(--sky-bot);transition:background 1.6s linear}
  #sheet::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px)}
  #sheet.on{display:flex}
  #sheet .card{position:relative;z-index:1}
  .card{width:min(86vw,360px);background:rgba(20,22,40,.94);border:1px solid rgba(255,255,255,.12);
        border-radius:18px;padding:22px 20px;box-shadow:0 18px 60px rgba(0,0,0,.6)}
  .card h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:20px;margin-bottom:6px}
  .card p{font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:16px}
  .card label{display:block;font-size:11px;color:var(--faint);margin:10px 0 4px;letter-spacing:.06em;text-transform:uppercase}
  .card input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.16);border-radius:10px;
              color:var(--ink);font-family:var(--mono);font-size:16px;padding:11px 12px}
  .card select{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.16);border-radius:10px;
              color:var(--ink);font-family:var(--mono);font-size:16px;padding:11px 12px;-webkit-appearance:none;appearance:none}
  .coordrow{display:flex;gap:8px;align-items:stretch}
  .coordrow input{flex:1}
  .seg{display:flex;border:1px solid rgba(255,255,255,.16);border-radius:10px;overflow:hidden}
  .seg span{display:flex;align-items:center;justify-content:center;width:40px;font-family:var(--mono);
            font-size:15px;color:var(--dim);cursor:pointer;transition:background .15s,color .15s}
  .seg span.sel{background:rgba(246,192,116,.9);color:#1b1206;font-weight:600}
  .btns{display:flex;gap:10px;margin-top:18px}
  .card button{flex:1;border:0;border-radius:11px;padding:12px;font-family:var(--mono);font-size:14px;
               letter-spacing:.03em;cursor:pointer}
  #useGps{background:rgba(255,255,255,.12);color:var(--ink)}
  #useMan{background:linear-gradient(180deg,#f6c074,#e0894a);color:#1b1206;font-weight:600}
  .err{color:#f0a06a;font-size:11px;margin-top:6px;min-height:14px}
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<div id="horizon"></div>
<div id="sun"></div>

<div class="wrap">
  <header>
    <div class="phase" id="phase">acquiring sky…</div>
    <div class="real" id="real">—</div>
    <div class="real there" id="realThere"></div>
  </header>

  <div class="centre">
    <div class="clock" id="clock">··:··:··</div>
    <div class="clk-label">solar time</div>
  </div>

  <footer class="foot">
    <div class="row"><span>position</span> <b id="pos">waiting for GPS…</b></div>
    <div class="row"><span>second length</span> <b id="rate">—</b></div>
    <div class="row"><span id="srss">—</span></div>
    <div class="row"><span class="tap" id="setLoc">set location manually</span><span id="status">·</span></div>
  </footer>
</div>

<div id="sheet">
  <div class="card">
    <h2>Set location</h2>
    <p>GPS is asked for every time the app opens. If it's unavailable offline, enter coordinates manually. No minus signs needed — pick the hemisphere.</p>
    <label>Latitude</label>
    <div class="coordrow">
      <input id="mlat" type="text" inputmode="decimal" placeholder="35.334282">
      <div class="seg" id="latSeg" data-val="S">
        <span data-h="N">N</span><span data-h="S" class="sel">S</span>
      </div>
    </div>
    <label>Longitude</label>
    <div class="coordrow">
      <input id="mlon" type="text" inputmode="decimal" placeholder="149.141934">
      <div class="seg" id="lonSeg" data-val="E">
        <span data-h="E" class="sel">E</span><span data-h="W">W</span>
      </div>
    </div>
    <div class="err" id="merr"></div>
    <label>Time zone at this location</label>
    <select id="mtz"></select>
    <div class="btns">
      <button id="useGps">Retry GPS</button>
      <button id="useMan">Use these</button>
    </div>
  </div>
</div>

<script>
/* ===================== Solar core (no network, no timezone) ===================== */
const D2R=Math.PI/180,R2D=180/Math.PI,mod=(x,m)=>((x%m)+m)%m;

function sunAltitudeDeg(ms,lat,lon){
  const jd=2440587.5+ms/86400000,n=jd-2451545.0;
  const L=mod(280.460+0.9856474*n,360);
  const g=mod(357.528+0.9856003*n,360)*D2R;
  const lam=mod(L+1.915*Math.sin(g)+0.020*Math.sin(2*g),360)*D2R;
  const eps=(23.439-0.0000004*n)*D2R;
  const dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const ra=mod(Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))*R2D,360);
  const gmst=mod(280.46061837+360.98564736629*n,360);
  const lst=mod(gmst+lon,360);
  const ha=(mod(lst-ra+540,360)-180)*D2R, latr=lat*D2R;
  return Math.asin(Math.sin(latr)*Math.sin(dec)+Math.cos(latr)*Math.cos(dec)*Math.cos(ha))*R2D;
}
function hourAngleDeg(ms,lat,lon){
  const jd=2440587.5+ms/86400000,n=jd-2451545.0;
  const L=mod(280.460+0.9856474*n,360);
  const g=mod(357.528+0.9856003*n,360)*D2R;
  const lam=mod(L+1.915*Math.sin(g)+0.020*Math.sin(2*g),360)*D2R;
  const eps=(23.439-0.0000004*n)*D2R;
  const ra=mod(Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))*R2D,360);
  const gmst=mod(280.46061837+360.98564736629*n,360);
  const lst=mod(gmst+lon,360);
  return mod(lst-ra+540,360)-180;
}
function nearestTransit(nowMs,lat,lon){
  const rate=360.98564736629/86400000; let t=nowMs;
  for(let i=0;i<4;i++){ t-=hourAngleDeg(t,lat,lon)/rate; }
  return t;
}
const ALT={astro:-18,naut:-12,civil:-6,sun:-0.833};
function buildAnchors(nowMs,lat,lon){
  const noon=nearestTransit(nowMs,lat,lon);
  const t0=noon-12*3600000, t4=noon+12*3600000, step=15000;
  function cross(altT,rising){
    let pT=t0,pA=sunAltitudeDeg(t0,lat,lon);
    for(let t=t0+step;t<=t4;t+=step){
      const a=sunAltitudeDeg(t,lat,lon);
      if(rising&&pA<altT&&altT<=a) return pT+(altT-pA)/(a-pA)*step;
      if(!rising&&pA>=altT&&altT>a) return pT+(altT-pA)/(a-pA)*step;
      pT=t;pA=a;
    } return null;
  }
  const ev={m0:t0,
    astro_dawn:cross(ALT.astro,true),naut_dawn:cross(ALT.naut,true),civil_dawn:cross(ALT.civil,true),
    sunrise:cross(ALT.sun,true),noon:noon,sunset:cross(ALT.sun,false),
    civil_dusk:cross(ALT.civil,false),naut_dusk:cross(ALT.naut,false),astro_dusk:cross(ALT.astro,false),m1:t4};
  const SPEC=[['m0',0],['astro_dawn',16200],['naut_dawn',18000],['civil_dawn',19800],['sunrise',21600],
    ['noon',43200],['sunset',64800],['civil_dusk',66600],['naut_dusk',68400],['astro_dusk',70200],['m1',86400]];
  const anchors=[];
  for(const [k,disp] of SPEC){ const rt=ev[k];
    if(rt==null) continue;
    if(anchors.length&&rt<=anchors[anchors.length-1].rt) continue;
    anchors.push({rt,disp}); }
  return {anchors,ev};
}
function realToDisplay(ms,A){
  if(ms<A[0].rt||ms>=A[A.length-1].rt) return null;
  for(let i=1;i<A.length;i++){ const a=A[i-1],b=A[i];
    if(a.rt<=ms&&ms<b.rt){ return a.disp+(ms-a.rt)/(b.rt-a.rt)*(b.disp-a.disp); } }
  return null;
}
function segmentRate(ms,A){ // display-seconds per real-second in current segment
  for(let i=1;i<A.length;i++){ const a=A[i-1],b=A[i];
    if(a.rt<=ms&&ms<b.rt){ return (b.disp-a.disp)/((b.rt-a.rt)/1000); } }
  return 1;
}
function fmtDisplay(disp){
  let s=Math.floor(disp)%86400; if(s<0)s+=86400;
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  const period=h<12?'AM':'PM',h12=(h%12)||12,p=n=>String(n).padStart(2,'0');
  return `${p(h12)}:${p(m)}:${p(sec)} ${period}`;
}
function phaseOf(disp){
  const d=disp;
  if(d<16200)return['night','—'];
  if(d<18000)return['astronomical dawn','first light'];
  if(d<19800)return['nautical dawn','horizon emerging'];
  if(d<21600)return['civil dawn','daybreak'];
  if(d<43200)return['morning','sun climbing'];
  if(d<64800)return['afternoon','sun descending'];
  if(d<66600)return['civil dusk','last light'];
  if(d<68400)return['nautical dusk','horizon fading'];
  if(d<70200)return['astronomical dusk','into the dark'];
  return['night','—'];
}

/* ===================== Sky rendering ===================== */
// palette anchors keyed by solar altitude (deg): [alt,[topRGB],[botRGB]]
const SKY=[
  [ 75,[64,116,196],[150,196,228]],
  [ 18,[70,122,200],[176,200,226]],
  [  4,[58,86,164],[235,168,108]],
  [ -0.8,[44,60,128],[244,150,92]],
  [ -6,[26,34,90],[150,84,108]],
  [ -12,[14,18,52],[44,42,96]],
  [ -18,[8,10,30],[18,20,50]],
  [ -34,[4,5,15],[7,9,22]],
];
const lerp=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
function skyFor(alt){
  alt=Math.max(-40,Math.min(80,alt));
  for(let i=0;i<SKY.length-1;i++){
    const [hi,t0,b0]=SKY[i],[lo,t1,b1]=SKY[i+1];
    if(alt<=hi&&alt>=lo){ const f=(hi-alt)/(hi-lo); return [lerp(t0,t1,f),lerp(b0,b1,f)]; }
  }
  return alt>SKY[0][0]?[SKY[0][1],SKY[0][2]]:[SKY[SKY.length-1][1],SKY[SKY.length-1][2]];
}
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
function paintSky(alt){
  const [top,bot]=skyFor(alt);
  const mid=lerp(top,bot,0.55);
  const root=document.documentElement.style;
  root.setProperty('--sky-top',rgb(top));
  root.setProperty('--sky-mid',rgb(mid));
  root.setProperty('--sky-bot',rgb(bot));
  document.querySelector('meta[name=theme-color]').setAttribute('content',rgb(bot));
  // stars fade in below the horizon
  starsEl.style.setProperty('--star', alt<-8?1:(alt<2?(2-alt)/10:0));
  // sun position: alt 0 -> horizon(72%), higher up, lower below
  let y = alt>=0 ? 72 - alt*(64/75) : 72 + (-alt)*(20/18);
  y=Math.max(4,Math.min(96,y));
  sunEl.style.transform=`translateY(${(y-72)}vh)`;
  sunEl.style.opacity = alt>-9 ? 1 : Math.max(0,(alt+18)/9*0.5);
}

/* ===================== App ===================== */
const clockEl=document.getElementById('clock'),phaseEl=document.getElementById('phase'),
  realEl=document.getElementById('real'),posEl=document.getElementById('pos'),
  rateEl=document.getElementById('rate'),srssEl=document.getElementById('srss'),
  statusEl=document.getElementById('status'),starsEl=document.getElementById('stars'),
  sunEl=document.getElementById('sun'),sheet=document.getElementById('sheet'),
  merr=document.getElementById('merr'),realThereEl=document.getElementById('realThere'),
  tzSel=document.getElementById('mtz');

// star field
(function(){let h='';for(let i=0;i<70;i++){h+=`<div class="star" style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*55).toFixed(2)}%;animation-delay:${(Math.random()*4).toFixed(2)}s"></div>`;}starsEl.innerHTML=h;})();

let coords=null, anchors=null, ev=null, lastStr=null;

// Civil-time zones. The device zone is where the *user* physically is; the
// location zone is for the selected coordinates' clock (offline via the OS's
// built-in IANA database). For GPS they're the same; for a manual remote
// location the user picks the zone.
const deviceTz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'UTC';
let locationTz = deviceTz;

const tzCity = z => z.split('/').pop().replace(/_/g,' ');
function fmtTime(ms,tz){ // e.g. 07:56:53 pm  (locale decides am/pm casing)
  return new Date(ms).toLocaleTimeString([], {timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function fmtDate(ms,tz){ return new Date(ms).toLocaleDateString([], {timeZone:tz,weekday:'long',day:'numeric',month:'long'}); }
function localHM(ms,tz){ return new Date(ms).toLocaleTimeString([], {timeZone:tz,hour:'2-digit',minute:'2-digit'}); }

function rebuild(now){ const r=buildAnchors(now,coords.lat,coords.lon); anchors=r.anchors; ev=r.ev; }

function readouts(now,disp){
  const sameTz = (locationTz===deviceTz);
  // Line 1: where the user physically is (device clock).
  realEl.textContent = (sameTz ? '' : 'here · ')
                       + fmtDate(now,deviceTz) + '  ·  ' + fmtTime(now,deviceTz)
                       + (sameTz ? ' local' : '');
  // Line 2: the selected location's civil time (only if it differs).
  if(sameTz){ realThereEl.textContent=''; }
  else{ realThereEl.textContent = tzCity(locationTz) + ' · ' + fmtDate(now,locationTz) + '  ·  ' + fmtTime(now,locationTz); }

  const [ph,sub]=phaseOf(disp);
  phaseEl.textContent = ph + (sub!=='—' ? ' — '+sub : '');
  posEl.textContent = `${coords.lat.toFixed(4)}°, ${coords.lon.toFixed(4)}°`
                     + (coords.acc?`  ±${Math.round(coords.acc)}m`:'') + (coords.manual?'  (manual)':'');
  const r=segmentRate(now,anchors);
  rateEl.textContent = `${(1/r).toFixed(3)} s  (${r>1?'compressed':r<1?'stretched':'1:1'})`;
  // sunrise/noon/sunset are events AT the location → show in the location's zone.
  if(ev.sunrise&&ev.sunset) srssEl.textContent=`sunrise ${localHM(ev.sunrise,locationTz)}   solar noon ${localHM(ev.noon,locationTz)}   sunset ${localHM(ev.sunset,locationTz)}`;
  else srssEl.textContent=`solar noon ${localHM(ev.noon,locationTz)}`;
}

function frame(){
  const now=Date.now();
  if(coords){
    if(!anchors||now<anchors[0].rt||now>=anchors[anchors.length-1].rt) rebuild(now);
    const disp=realToDisplay(now,anchors);
    if(disp!=null){
      const str=fmtDisplay(disp);
      if(str!==lastStr){ clockEl.textContent=str; lastStr=str; readouts(now,disp); }
    }
    paintSky(sunAltitudeDeg(now,coords.lat,coords.lon));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- location ---------- */
function setCoords(lat,lon,acc,manual,tz){
  coords={lat,lon,acc:acc||0,manual:!!manual};
  locationTz = tz || deviceTz;
  localStorage.setItem('coords',JSON.stringify({lat,lon,tz:locationTz,manual:!!manual}));
  anchors=null; lastStr=null;
  sheet.classList.remove('on');
}
function requestGps(){
  statusEl.textContent='locating…';
  if(!('geolocation' in navigator)){ onGpsFail('no GPS API'); return; }
  navigator.geolocation.getCurrentPosition(
    // Physically at the location → its civil zone is the device's own zone.
    p=>{ setCoords(p.coords.latitude,p.coords.longitude,p.coords.accuracy,false,deviceTz); statusEl.textContent='GPS ✓'; },
    e=>{ onGpsFail(e.message||'denied'); },
    {enableHighAccuracy:true,timeout:12000,maximumAge:0}
  );
}
function onGpsFail(msg){
  statusEl.textContent='GPS unavailable';
  const saved=JSON.parse(localStorage.getItem('coords')||'null');
  if(!coords){
    if(saved){ setCoords(saved.lat,saved.lon,0,true,saved.tz||deviceTz); statusEl.textContent='using last known'; }
    else openSheet(msg);
  }
}
function openSheet(msg){
  const saved=JSON.parse(localStorage.getItem('coords')||'null');
  const la=saved?saved.lat:(coords?coords.lat:null), lo=saved?saved.lon:(coords?coords.lon:null);
  document.getElementById('mlat').value = la!=null?Math.abs(la):'';
  document.getElementById('mlon').value = lo!=null?Math.abs(lo):'';
  if(la!=null) setSeg('latSeg', la<0?'S':'N');
  if(lo!=null) setSeg('lonSeg', lo<0?'W':'E');
  const wantTz=(saved&&saved.tz)?saved.tz:locationTz;
  if(tzSel.querySelector(`option[value="${wantTz}"]`)) tzSel.value=wantTz;
  merr.textContent=msg?('GPS: '+msg):''; sheet.classList.add('on');
}
function setSeg(id,h){
  const seg=document.getElementById(id); seg.dataset.val=h;
  seg.querySelectorAll('span').forEach(s=>s.classList.toggle('sel', s.dataset.h===h));
}
['latSeg','lonSeg'].forEach(id=>{
  document.getElementById(id).querySelectorAll('span').forEach(s=>{
    s.onclick=()=>setSeg(id, s.dataset.h);
  });
});
document.getElementById('setLoc').onclick=()=>openSheet('');
document.getElementById('useGps').onclick=requestGps;
document.getElementById('useMan').onclick=()=>{
  let la=parseFloat(document.getElementById('mlat').value),
      lo=parseFloat(document.getElementById('mlon').value);
  if(!isFinite(la)||!isFinite(lo)||la<0||la>90||lo<0||lo>180){ merr.textContent='Enter valid numbers (no sign needed).'; return; }
  if(document.getElementById('latSeg').dataset.val==='S') la=-la;
  if(document.getElementById('lonSeg').dataset.val==='W') lo=-lo;
  setCoords(la,lo,0,true,tzSel.value||deviceTz); statusEl.textContent='manual ✓';
};

// Populate the timezone picker once, from the OS's built-in IANA list (offline).
(function(){
  let zones=[];
  try{ zones = Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : []; }catch(e){}
  if(!zones.length) zones=[deviceTz,'UTC','America/Santiago','Europe/London','America/New_York','Asia/Tokyo'];
  if(!zones.includes(deviceTz)) zones.unshift(deviceTz);
  tzSel.innerHTML = zones.map(z=>`<option value="${z}">${z.replace(/_/g,' ')}</option>`).join('');
})();

// ask for live GPS on open, and again whenever returning to the app
requestGps();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') requestGps(); });

/* ---------- offline service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
